name: CI

on:
  push:
    branches: [master, main, "port-*", "feature-*"]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git
        # fusion-core is an in-tree editable install in the monorepo venv
        # but has no PyPI release, so CI resolves it from git. See
        # dahai80/fusion-core#9 for the permanent publish-track fix.
      - run: pip install -e ".[test,api,oidc,ha,security]"
      - run: pytest tests/ -v --tb=short -q
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
