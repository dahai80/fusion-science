[project]
name = "fusion-science"
version = "0.1.0"
description = "Fusion-Science — Local Scientific Research AI Workbench for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Fusion Labs"},
]

dependencies = [
    "fusion-core>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "biopython>=1.83",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "requests>=2.31.0",
    "xmltodict>=0.13.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
mlx = [
    "mlx>=0.20.0",
    "mlx-lm>=0.20.0",
]
jupyter = [
    "jupyter-client>=8.0.0",
    "jupyter-core>=5.0.0",
    "ipykernel>=6.0.0",
]
r = [
    "rpy2>=3.5.0",
]
molecule = [
    "rdkit>=2023.9.0",
    "py3Dmol>=2.0.0",
]
all = [
    "fusion-science[test,mlx,jupyter,r,molecule]",
]

[project.scripts]
fusion-science = "fusion_science.cli:main"
fusion-science-web = "fusion_science.cli:web"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fusion_science"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
include = ["fusion_science*"]