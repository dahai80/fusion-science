[project]
name = "fusion-science"
version = "1.0.10"
description = "Fusion-Science — Local Scientific Research AI Workbench for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Fusion Labs"},
]

dependencies = [
    # F-O8: pin upper bounds (next major) so an unattended `pip install -U`
    # cannot pull a breaking major release. The root requirements.lock holds
    # the exact resolved versions for reproducible multi-node installs.
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "aiofiles>=23.0.0,<25.0",
    "rich>=13.0.0,<15.0",
    "click>=8.1.0,<9.0",
    "pyyaml>=6.0,<7.0",
    "biopython>=1.83,<2.0",
    "numpy>=1.26.0,<3.0",
    "pandas>=2.0.0,<3.0",
    "matplotlib>=3.8.0,<4.0",
    "seaborn>=0.13.0,<2.0",
    "requests>=2.31.0,<3.0",
    "xmltodict>=0.13.0,<1.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "lxml>=4.9.0,<6.0",
    # F-S5: XXE-safe XML parsing used by pubmed.py + literature/search.py.
    # Hard import — install must fail closed if absent, not silently fall back.
    "defusedxml>=0.7.0,<1.0",
    "fusion-core",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "pytest-cov>=5.0.0,<7.0",
    "pytest-mock>=3.14.0,<4.0",
]
api = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn>=0.29.0,<1.0",
    "sse-starlette>=2.0.0,<3.0",
]
mlx = [
    "mlx>=0.20.0,<1.0",
    "mlx-lm>=0.20.0,<1.0",
]
jupyter = [
    "jupyter-client>=8.0.0,<9.0",
    "jupyter-core>=5.0.0,<6.0",
    "ipykernel>=6.0.0,<7.0",
]
r = [
    "rpy2>=3.5.0,<4.0",
]
molecule = [
    "rdkit>=2023.9.0,<2025.0",
    "py3Dmol>=2.0.0,<3.0",
]
# F-ENT-OIDC: external OAuth2/OIDC identity-provider support (issue #22).
# RS256 JWT verified against the IdP's JWKS; claim → local Role mapping.
# Lazy import — default install (no [oidc] extra) keeps the built-in HS256
# path and API-key auth working unchanged.
oidc = [
    "pyjwt>=2.8.0,<3.0",
    "cryptography>=42.0.0,<60.0",
]
# F-ENT-HA: multi-node HA — shared Postgres session store (issue #24).
# psycopg 3 (binary wheel) is the Postgres driver; lazy import so a default
# install without [ha] keeps the sqlite/memory path working.
ha = [
    "psycopg[binary]>=3.1.0,<4.0",
]
# G1 encryption-at-rest — AES-256-GCM envelope for audit JSON. Reuses
# cryptography (also pulled by [oidc]); lazy import so a default install
# without the extra degrades to plaintext with a warning, never crashes.
security = [
    "cryptography>=42.0.0,<60.0",
]
all = [
    "fusion-science[test,api,mlx,jupyter,r,molecule,oidc,ha,security]",
]

[project.scripts]
fusion-science = "fusion_science.cli:main"
fusion-science-web = "fusion_science.cli:web"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fusion_science"]
branch = true
relative_files = true
omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
include = ["fusion_science*"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["fusion_science", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/test_coverage_batch*.py" = ["E402", "F841", "SIM117", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_science"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"